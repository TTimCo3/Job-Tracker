name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check backend imports
        working-directory: backend/app
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: python3 -c "from main import app"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build backend
        run: docker build -t tracker-backend backend/

      - name: Build frontend
        run: docker build -t tracker-frontend frontend/

  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Create test environment
        run: |
          printf '%s\n' \
            'POSTGRES_USER=test_user' \
            'POSTGRES_PASSWORD=test_pass' \
            'POSTGRES_DB=test_db' > .env

          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://test:test@db:5432/test' > backend/.env

      - name: Start application
        run: docker compose up -d --build

      - name: Make sure it works
        run: curl -X GET http://localhost:5173/applications/
