name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest


    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check backend imports
        working-directory: backend/app
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: python3 -c "from main import app"

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Build backend
        run: docker build -t tracker-backend backend/

      - name: Build frontend
        run: docker build -t tracker-frontend frontend/

  compose:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Create test environment
        run: |
          printf '%s\n' \
            'POSTGRES_USER=test_user' \
            'POSTGRES_PASSWORD=test_pass' \
            'POSTGRES_DB=test_db' > .env

          printf '%s\n' \
            'DATABASE_URL=postgresql+psycopg://test_user:test_pass@db:5432/test_db' > backend/.env

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/applications/ >/dev/null; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend..."
            sleep 1
          done

          echo "Backend did not become ready"
          docker compose logs
          exit 1
            
      - name: POST test
        run: |
          curl --fail-with-body -X POST -H "Content-Type: application/json" \
            -d '{"company_name":"test_company","job_title":"test_job","status":"Applied"}' \
            http://localhost:8000/applications/
      
      - name: PUT test
        run: |
          curl --fail-with-body -X PUT -H "Content-Type: application/json" \
            -d '{"company_name":"test_company","job_title":"test_job","status":"Rejected","notes":"test_notes"}' \
            http://localhost:8000/applications/1

      - name: GET test
        run: |
            curl --fail-with-body -X GET http://localhost:8000/applications/

      - name: DELETE test
        run: |
          curl --fail-with-body -X DELETE http://localhost:8000/applications/1
      
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  publish:
    needs: [backend, frontend, docker, compose]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/internship-tracker-backend:latest backend/
          docker push ghcr.io/${{ github.repository_owner }}/internship-tracker-backend:latest

      - name: Build and push frontend
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/internship-tracker-frontend:latest frontend/
          docker push ghcr.io/${{ github.repository_owner }}/internship-tracker-frontend:latest
